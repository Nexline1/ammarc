name: mobile
on:
  push:
    paths: ['mobile/**', '.github/workflows/mobile.yml', 'src/**']
  workflow_dispatch:
    inputs:
      url:
        description: 'Ammarc address baked into the release APK. Empty = the live Render site.'
        required: false
      release:
        description: 'Version to publish as a GitHub Release once the emulator test passes (e.g. 1.0.0). Empty = no release.'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Generate platforms
        run: |
          flutter create --org com.nexline --project-name ammarc --platforms android,ios .
          git checkout -- test lib   # flutter create may add its own sample test
          rm -f test/widget_test.dart
          python3 tool/platforms.py
          flutter pub get
          dart run flutter_launcher_icons
      - run: flutter analyze --no-fatal-infos   # infos (e.g. material → material_ui move) are advice, not failures
      - run: flutter test
      - name: Debug APK (talks to the demo server at 10.0.2.2:5180)
        run: flutter build apk --debug --dart-define=AMMARC_URL=http://10.0.2.2:5180
      - name: Release APK
        run: flutter build apk --release --dart-define=AMMARC_URL=${{ inputs.url || 'https://ammarc-d68t.onrender.com' }}
      - uses: actions/upload-artifact@v4
        with:
          name: ammarc-apks
          path: |
            mobile/build/app/outputs/flutter-apk/app-debug.apk
            mobile/build/app/outputs/flutter-apk/app-release.apk

  emulator:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/download-artifact@v4
        with: { name: ammarc-apks, path: apk }
      - name: Start the demo server
        run: |
          npm ci
          npm run build
          MOCK=1 PORT=5180 nohup npx tsx server/index.ts > server.log 2>&1 &
          for i in $(seq 60); do curl -sf http://localhost:5180/api/status && break; sleep 1; done
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash mobile/tool/smoke.sh apk/app-debug.apk
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke
          path: |
            smoke/
            server.log

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release != ''
    needs: emulator
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: ammarc-apks, path: apk }
      - name: Publish the tested APK
        env: { GH_TOKEN: '${{ github.token }}', V: '${{ inputs.release }}' }
        run: |
          mv apk/app-release.apk "Ammarc-$V.apk"
          gh release create "mobile-v$V" "Ammarc-$V.apk" --repo "${{ github.repository }}" --target "${{ github.sha }}"             --title "Ammarc for Android $V"             --notes "Install on an Android phone: download Ammarc-$V.apk, open it, and allow installing from that source once. Opens ${{ inputs.url || 'https://ammarc-d68t.onrender.com' }}. Built and smoke-tested on an Android 14 emulator in this run."
