# Render Blueprint: deploys Ammarc (client + server) as one web service.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: ammarc
    runtime: node
    plan: free               # free: sleeps after 15 min idle, and files reset on every restart/deploy.
                             # To keep his projects, switch to starter and add back: disk { name: ammarc-data, mountPath: /var/data, sizeGB: 1 } + DATA_DIR=/var/data
    region: frankfurt        # closest Render region to Bahrain
    buildCommand: npm ci && npm run build && bash mobile/tool/build-web.sh   # the last step adds the native app at /m (skipped if Flutter fails)
    startCommand: npm start
    healthCheckPath: /api/status
    autoDeploy: true         # every push to main redeploys
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: HOST
        value: 0.0.0.0
      - key: APP_PASSWORD     # Render asks for it when you create the service; the app won't start on Render without it
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY  # leave empty for demo mode; add later in the dashboard
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GH_RELEASE_TOKEN   # read-only GitHub token so /app can hand out the Android APK from the private repo's Releases
        sync: false
      - key: DAILY_IMAGE_CAP
        value: "60"
      - key: DAILY_CLAUDE_CAP
        value: "300"
