name: ammarc
description: Ammarc, native — the same server and loop as the website, with its own screens, gestures and drawing.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  flutter_svg: ^2.0.10
  record: ^6.0.0
  share_plus: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: assets/icon.png
    background_color: "#F3F4F6"
    theme_color: "#F3F4F6"
  image_path: assets/icon.png
  adaptive_icon_background: "#16191D"
  adaptive_icon_foreground: assets/icon-fg.png
  remove_alpha_ios: true
